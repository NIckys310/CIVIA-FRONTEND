# CI del frontend de CIVIA: secretos → SCA → tipos → tests → lint → build.
# Las acciones están fijadas por hash de commit (cadena de suministro); el comentario indica la versión.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web-mobile:
    name: Web, móvil y paquetes (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Auditoría de dependencias de producción (SCA)
        run: npm run audit:prod
      - name: Tipos generados coinciden con el contrato
        run: |
          npm run generate -w @civia/shared-types
          git diff --exit-code packages/shared-types
      - name: Tipos
        run: npx turbo run typecheck
      - name: Tests (tokens, contraste WCAG, cliente API)
        run: npx turbo run test
      - name: Lint web
        run: npm run lint -w @civia/web
      - name: Build web
        run: npm run build -w @civia/web
