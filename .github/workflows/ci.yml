# CI de CIVIA-FRONTEND: secretos → servidor Java → sintaxis de los módulos JavaScript.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Interfaz y servidor (Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - name: Compilar el servidor web
        run: javac -d /tmp/civia-web server/CiviaWeb.java
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Sintaxis de los módulos (ES modules)
        run: for f in web/js/*.js web/js/views/*.js web/sw.js; do cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs || { echo "Error en $f"; exit 1; }; done
